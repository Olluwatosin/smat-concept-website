name: CI

# Deployment is handled by Vercel's native GitHub integration —
# every push to main is built and deployed by Vercel automatically.
# This workflow is the quality gate: build + lint must pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build and lint
        run: |
          cd frontend
          npm run build
          npm run lint
